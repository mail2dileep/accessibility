# Render service definition for separate frontend (static) and backend (Docker) deployments
# Replace the placeholder hostnames with the actual service URLs or configure env vars in the Render dashboard.
services:
  - type: static
    name: accessibility-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    publishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        # Set to the backend service URL after it's created, e.g. https://accessibility-backend.onrender.com
        value: https://accessibility-backend.onrender.com

  - type: web
    name: accessibility-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGIN
        # Set to the frontend service URL after it's created, e.g. https://accessibility-frontend.onrender.com
        value: https://accessibility-frontend.onrender.com
      # DO NOT store secrets here in plaintext; add them in the Render dashboard as secrets.
      # - key: OPENAI_API_KEY
      #   value: <your-openai-key>
